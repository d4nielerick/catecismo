name: LiturgiaDiaria
options:
  bundleIdPrefix: com.santadoutrina
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LiturgiaDiaria:
    type: application
    platform: iOS
    sources:
      - LiturgiaDiaria
    info:
      path: LiturgiaDiaria/Info.plist
      properties:
        CFBundleDisplayName: Liturgia Diária
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [pt-BR]
        CFBundleDevelopmentRegion: pt-BR
        UIAppFonts: [inria-serif-400.ttf, inria-serif-400-italic.ttf, inria-serif-700.ttf]
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        NSPhotoLibraryAddUsageDescription: Para salvar nas suas Fotos os cards e as páginas das leituras que você escolher.
        LSApplicationQueriesSchemes: [whatsapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielerick.liturgia
        DEVELOPMENT_TEAM: NM33KUNYGF
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
