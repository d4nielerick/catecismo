<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Recarregar a página sempre abre o dia de hoje (quem chega por um link de dia vê aquele dia).
    if (performance.getEntriesByType('navigation')[0]?.type === 'reload'
      && (/^\/liturgiadiaria\/\d{4}-\d{2}-\d{2}\/?$/.test(location.pathname) || location.search.includes('data='))) {
      location.replace('/liturgiadiaria/');
    }
  </script>

  <title>Liturgia do Dia — Catecismo da Igreja Católica</title>
  <meta name="description" content="Leituras litúrgicas do dia, com texto completo em português.">
  <link rel="canonical" href="https://santadoutrina.cloud/liturgiadiaria/">

  <!-- Open Graph -->
  <meta property="og:title"       content="Liturgia do Dia — Catecismo da Igreja Católica">
  <meta property="og:description" content="Leituras litúrgicas do dia, com texto completo em português.">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://santadoutrina.cloud/liturgiadiaria/">
  <meta property="og:image"       content="https://santadoutrina.cloud/liturgiadiaria/og/liturgia.jpg">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"      content="pt_BR">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Liturgia do Dia — Catecismo da Igreja Católica">
  <meta name="twitter:description" content="Leituras litúrgicas do dia, com texto completo em português.">
  <meta name="twitter:image"       content="https://santadoutrina.cloud/liturgiadiaria/og/liturgia.jpg">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/favicon-180.png">

  <!-- Fonte servida daqui: sem terceiro no caminho e sem o texto pular quando ela chega -->
  <link rel="preload" href="/assets/fonts/inria-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inria-serif-400-italic.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/liturgiadiaria/liturgiadiaria.css">
  <!-- A entrada do cabeçalho roda assim que o script chega: busca os dois módulos já no começo -->
  <link rel="modulepreload" href="/liturgiadiaria/liturgiadiaria.js">
  <link rel="modulepreload" href="/liturgiadiaria/render.mjs">
  <!-- O texto já vem no HTML; some até a animação de entrada assumir (nunca mais que 3s) -->
  <script>
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('lp-anima');
      setTimeout(() => document.documentElement.classList.add('lp-pronto', 'lp-cabeca-pronta'), 3000);
    }
  </script>

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Liturgia do Dia — Catecismo da Igreja Católica",
    "url": "https://santadoutrina.cloud/liturgiadiaria/",
    "description": "Leituras litúrgicas do dia, com texto completo em português."
  }
  </script>

  <!-- Umami Analytics -->
  <script defer src="https://umami.danielerick.com/script.js" data-website-id="28c35f85-bd1b-4ea9-8f52-fc98d33b4974"></script>
</head>
<body>

<div class="lp-pagina">

  <!-- ── Lateral: título e dia litúrgico ─────────────────────────────────── -->
  <aside class="lp-lateral">
    <div class="lp-cabeca">
      <h1 class="lp-titulo"><span class="lp-marca">Liturgia Diária</span><span class="lp-titulo-data" id="lp-titulo-data" aria-hidden="true"></span><span class="lp-so-leitor" id="lp-titulo-leitor"></span></h1>
      <p class="lp-data" id="lp-data">Carregando…</p>
    </div>
    <div class="tempo-wrap" id="lp-tempo-wrap">
      <span class="cor-dot" id="lp-cor-dot"></span>
      <span class="tempo-badge" id="lp-tempo"></span>
    </div>
    <p class="nome-dia" id="lp-nome-dia"></p>

    <div class="lp-avisos" id="lp-avisos">
      <p class="lp-aviso-texto" title="Próximo aviso"></p>
    </div>

  </aside>

  <span class="lp-fita" id="lp-fita" role="img" hidden>
    <svg viewBox="0 0 30 68" preserveAspectRatio="none" aria-hidden="true">
      <path class="lp-fita-fundo" d="M0 -1H30V68L15 56L0 68Z"/>
      <path class="lp-fita-costura" d="M3.5 -1V61L15 51.5L26.5 61V-1"/>
    </svg>
  </span>

  <div class="lp-faixa lp-faixa-esq" aria-hidden="true"></div>

  <!-- ── Leituras (com as abas fixas no alto da coluna) ─────────────────── -->
  <main class="lp-main">
    <div class="lp-compacto" id="lp-compacto" aria-hidden="true"><span class="lp-compacto-fita"></span><span id="lp-compacto-data"></span></div>
    <nav class="lp-tabs" id="lp-tabs" aria-label="Leituras"></nav>
    <div id="conteudo" class="lp-conteudo">
      <p class="loading">Buscando leituras do dia…</p>
    </div>
    <nav class="lp-dias" id="lp-dias" aria-label="Outros dias"></nav>
    <a class="lp-topo" href="#top">↑ Voltar ao topo</a>
  </main>

  <div class="lp-faixa lp-faixa-dir" aria-hidden="true"></div>

  <!-- ── Direita: calendário ─────────────────────────────────────────────── -->
  <aside class="lp-direita" aria-label="Calendário da liturgia" data-lenis-prevent>
    <div class="cal-wrap" id="cal-wrap"></div>
    <section class="lp-sobre" id="lp-sobre" aria-label="Sobre a celebração" hidden></section>
  </aside>
  <!-- No celular o lembrete fica embaixo do calendário (move antes de pintar; liturgiadiaria.js cuida das mudanças de tamanho) -->
  <script>
    if (matchMedia('(max-width: 760px)').matches) document.querySelector('.lp-direita').append(document.getElementById('lp-avisos'));
    else if (matchMedia('(max-width: 1080px)').matches) document.querySelector('.lp-lateral').append(document.querySelector('.lp-direita'));
  </script>

</div>

<dialog class="lp-modal" id="lp-santo" aria-labelledby="lp-santo-titulo" data-lenis-prevent>
  <div class="lp-modal-caixa">
    <button class="lp-modal-fechar" type="button" aria-label="Fechar">×</button>
    <p class="lp-modal-sobre">Sobre a celebração</p>
    <h2 class="lp-modal-titulo" id="lp-santo-titulo"></h2>
    <div id="lp-santo-corpo"></div>
    <p class="lp-modal-credito">Texto da <a href="https://pt.wikipedia.org/" target="_blank" rel="noopener">Wikipédia</a>, a enciclopédia livre, sob a licença <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pt_BR" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</p>
  </div>
</dialog>

<script type="module" src="/liturgiadiaria/liturgiadiaria.js"></script>
</body>
</html>
