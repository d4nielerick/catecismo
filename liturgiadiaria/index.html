  <style>
    /* ── Base ─────────────────────────────────────────────────────────────── */
    html, body {
      background: var(--litur-bg, var(--color-bg));
      min-height: 100%;
      transition: background 0.7s ease;
    }

    body {
      font-family: var(--font-sans);
      color: var(--color-text);
    }

    /* ── Layout dois painéis ──────────────────────────────────────────────── */
    .lp-wrap {
      display: flex;
      width: calc(100% - 1.5rem);
      max-width: 1400px;
      margin: 0.75rem auto;
      min-height: calc(100vh - 1.5rem);
      background: var(--color-surface);
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    /* Nome do dia litúrgico */
    .nome-dia {
      font-family: var(--font-serif);
      font-size: 0.88rem;
      font-style: italic;
      color: var(--color-text);
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .lp-sidebar {
      width: 360px;
      flex-shrink: 0;
      padding: 2rem 1.5rem 3rem;
      border-right: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      align-self: flex-start;   /* não estica junto com o conteúdo: dá espaço pro sticky */
      max-height: 100vh;        /* curto fica colado no topo; longo rola internamente */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .lp-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-muted);
      text-decoration: none;
      font-size: 0.8rem;
      margin-bottom: 2rem;
      transition: color 0.15s;
    }
    .lp-back:hover { color: var(--color-primary); }
    .lp-back svg { flex-shrink: 0; }

    .lp-titulo {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--color-text);
      margin: 0 0 0.4rem;
      line-height: 1.3;
    }

    .lp-data {
      font-size: 0.78rem;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .tempo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .cor-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tempo-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    /* ── Calendário ───────────────────────────────────────────────────────── */
    .cal-wrap {
      margin-top: 1.5rem;
      border-top: 1px solid var(--color-border);
      padding-top: 1.25rem;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .cal-mes {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--color-text);
    }

    .cal-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-muted);
      font-size: 1rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }

    .cal-btn:hover { color: var(--color-primary); background: rgba(26,60,46,0.06); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .cal-dow {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      font-weight: 600;
      text-align: center;
      color: var(--color-muted);
      padding: 0.2rem 0;
      text-transform: uppercase;
    }

    .cal-dia {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      text-align: center;
      padding: 0.3rem 0;
      border-radius: 4px;
      cursor: pointer;
      color: var(--color-muted);
      transition: background 0.1s, color 0.1s;
      text-decoration: none;
    }

    .cal-dia:hover { background: rgba(26,60,46,0.08); color: var(--color-text); }
    .cal-dia.hoje { background: var(--color-primary); color: #fff; font-weight: 600; }
    .cal-dia.selecionado { background: rgba(26,60,46,0.15); color: var(--color-primary); font-weight: 600; }
    .cal-dia.vazio { cursor: default; }
    .cal-dia.fora-range { opacity: 0.3; pointer-events: none; }

    /* Nav de leituras */
    .lp-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      margin: 0;
      padding: 0;
    }

    .lp-nav a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--color-muted);
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }

    .lp-nav a:hover {
      background: rgba(26,60,46,0.06);
      color: var(--color-text);
    }

    .lp-nav a.ativa {
      background: rgba(26,60,46,0.08);
      color: var(--color-primary);
      font-weight: 600;
    }

    .lp-nav .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.4;
      flex-shrink: 0;
    }

    .lp-nav a.ativa .nav-dot { opacity: 1; }

    /* ── Conteúdo principal ───────────────────────────────────────────────── */
    .lp-main {
      flex: 1;
      padding: 2.5rem 2.5rem 5rem;
      min-width: 0;
    }

    /* Cards de leitura */
    .leitura-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.75rem 2rem;
      margin-bottom: 1.25rem;
      scroll-margin-top: 1.5rem;
    }

    .leitura-card.card-evangelho {
      border-color: rgba(26,60,46,0.2);
      box-shadow: 0 2px 12px rgba(26,60,46,0.06);
    }

    .leitura-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.3rem;
    }

    .card-evangelho .leitura-label { color: var(--color-accent-dk); }

    .leitura-ref {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 1.25rem;
    }

    .leitura-texto {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--color-text);
    }

    .vers-num {
      font-size: 0.65rem;
      font-family: var(--font-sans);
      color: var(--color-muted);
      vertical-align: super;
      margin-right: 0.2em;
      user-select: none;
    }

    /* ── Salmo ────────────────────────────────────────────────────────────── */
    .salmo-refrao {
      background: rgba(197,160,40,0.07);
      border-left: 2px solid var(--color-accent);
      border-radius: 0 6px 6px 0;
      padding: 0.6rem 1rem;
      margin-bottom: 1.25rem;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--color-text);
    }

    .salmo-r-label {
      font-style: normal;
      font-weight: 600;
      color: var(--color-accent-dk);
      margin-right: 0.4rem;
    }

    .salmo-estrofe {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--color-text);
      margin-bottom: 0.25rem;
    }

    .salmo-r-sep {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-accent-dk);
      margin: 0.75rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .salmo-r-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .loading, .erro {
      font-family: var(--font-sans);
      color: var(--color-muted);
      text-align: center;
      padding: 3rem 0;
      font-size: 0.9rem;
    }

    .nome-dia .complemento {
      display: block;
      margin-top: 0.2rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-style: normal;
      color: var(--color-muted);
    }

    .leitura-titulo {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--color-muted);
      line-height: 1.5;
      margin: -0.75rem 0 1rem;
    }

    .acl-verso {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--color-text);
    }

    .salmo-ou, .leitura-alt-ou {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-accent-dk);
      margin: 0 0.35rem;
    }

    /* Leitura "à escolha" (mais breve, outra opção): recolhida dentro do card */
    .leitura-alt {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--color-border);
    }
    .leitura-alt > summary { cursor: pointer; font-size: 0.8rem; color: var(--color-muted); }
    .leitura-alt > summary .leitura-alt-ou { margin-left: 0; }
    .leitura-alt[open] > summary { margin-bottom: 1rem; }

    /* Outras missas do dia (vigília, noite, aurora, leituras à escolha) */
    .missa-extra { margin: 2rem 0 1.25rem; }
    .missa-extra > summary {
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-text);
      padding: 0.5rem 0;
    }
    .missa-extra[open] > summary { margin-bottom: 1rem; }

    /* ── Mobile tabs ──────────────────────────────────────────────────────── */
    .lp-tabs {
      display: none;
      overflow-x: auto;
      gap: 0.25rem;
      padding: 1rem 1.25rem 0;
      scrollbar-width: none;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .lp-tabs::-webkit-scrollbar { display: none; }

    .lp-tabs a {
      display: inline-block;
      white-space: nowrap;
      padding: 0.5rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--color-muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.12s, border-color 0.12s;
    }

    .lp-tabs a.ativa {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
      font-weight: 600;
    }

    /* ── Responsivo ───────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .lp-wrap { flex-direction: column; margin: 0; border-radius: 0; box-shadow: none; min-height: 100vh; }

      .lp-sidebar {
        position: static;
        height: auto;
        width: 100%;
        border-right: none;
        border-bottom: none;
        padding: 1.5rem 1.25rem 0;
        flex-direction: column;
        gap: 0;
      }

      .lp-nav { display: none; }
      .lp-tabs { display: flex; }

      .lp-main { padding: 1.25rem 1.25rem 4rem; }

      .leitura-card { padding: 1.25rem 1.25rem; }
    }
  </style>
</head>

<style>

.bf-item:hover .bf-icone{transform:scale(1.1);background:rgba(255,255,255,.9)}
.bf-item:nth-child(1):hover .bf-icone{color:#2d6a4f}
.bf-item:nth-child(2):hover .bf-icone{color:#2c4a8c}
.bf-item:nth-child(3):hover .bf-icone{color:#8c4a2c}
.bf-item:nth-child(4):hover .bf-icone{color:#25D366}
.bf-item.ativo .bf-icone{background:rgba(255,255,255,.95);color:#8c4a2c}
.bf-label{font-size:.62rem;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,0);transition:color .15s;white-space:nowrap}
.bf-item:hover .bf-label{color:rgba(255,255,255,.95)}
</style>
<script>
(function(){const b=document.getElementById('barra-flutuante');const Z=80;let t;function show(){clearTimeout(t);b.classList.add('visivel')}function hide(d=600){clearTimeout(t);t=setTimeout(()=>b.classList.remove('visivel'),d)}show();hide(3000);document.addEventListener('mousemove',e=>{if(e.clientY>window.innerHeight-Z){show()}else if(!b.matches(':hover')){hide()}});b.addEventListener('mouseenter',show);b.addEventListener('mouseleave',()=>hide())})();
</script>
