  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "name": "Liturgia do Dia — Catecismo da Igreja Católica",

    "description": "Leituras litúrgicas do dia, com texto completo em português."

  <!-- Umami Analytics -->
  <script defer src="https://umami.danielerick.com/script.js" data-website-id="28c35f85-bd1b-4ea9-8f52-fc98d33b4974"></script>
  <style>
    /* Layout do Figma "Catecismo" › MacBook Pro 16" - 1 (node 65:3):
       lateral (título + calendário) · faixa floral · coluna de leitura · faixa floral · respiro */
    :root {
      --lp-fundo: #fcfaf7;
      --lp-tinta: #000;
      --lp-texto: rgba(0, 0, 0, 0.67);
      --lp-suave: rgba(0, 0, 0, 0.45);
      --lp-linha: rgba(0, 0, 0, 0.08);
      --lp-vermelho: #cb2e2e; /* o mesmo da cruz do divisor */
      --lp-faixa-w: 120px;
      --font-titulo: 'Times New Roman', Times, 'EB Garamond', Georgia, serif;
      --font-leitura: 'Inria Serif', 'EB Garamond', Georgia, serif;
    }

    html, body { background: var(--lp-fundo); min-height: 100%; }
    body { font-family: var(--font-leitura); color: var(--lp-texto); }

    .lp-pagina {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) var(--lp-faixa-w) minmax(0, 500px) var(--lp-faixa-w) minmax(290px, 1fr);
      min-height: 100vh;
    }

    /* ── Lateral ─────────────────────────────────────────────────────────── */
    .lp-lateral {
      grid-column: 1;
      grid-row: 1;
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100vh;
      overflow-y: auto;
      padding: 1.5rem 2rem 3rem 1.95rem;
    }

    .lp-titulo {
      font-family: var(--font-titulo);
      font-style: italic;
      font-weight: 400;
      font-size: 78px;
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: var(--lp-tinta);
      margin: 0 0 1.5rem;
    }

    .lp-data {
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--lp-suave);
      margin: 0 0 0.35rem;
    }
    .lp-data::first-letter { text-transform: uppercase; }

    .tempo-wrap { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
    .cor-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tempo-badge {
      font-family: var(--font-sans);
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lp-suave);
    }

    .nome-dia {
      font-style: italic;
      font-size: 1rem;
      line-height: 1.45;
      color: var(--lp-tinta);
      margin: 0;
    }
    .nome-dia .complemento {
      display: block;
      margin-top: 0.15rem;
      font-style: normal;
      font-size: 0.8rem;
      color: var(--lp-suave);
    }

    .lp-nav { display: none; }

    /* ── Calendário ──────────────────────────────────────────────────────── */
    /* Coluna da direita, depois do ornamento; fica parada enquanto a leitura rola */
    .lp-direita {
      grid-column: 5;
      grid-row: 1;
      position: sticky;
      top: 0;
      align-self: start;
      padding: 3.25rem 2rem 3rem 2.25rem;
    }
    .cal-wrap { max-width: 257px; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
    .cal-mes { font-family: var(--font-sans); font-size: 0.72rem; font-weight: 600; color: var(--lp-tinta); }
    .cal-btn {
      background: none; border: none; cursor: pointer; color: var(--lp-suave);
      font-size: 1rem; padding: 0.1rem 0.4rem; border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }
    .cal-btn:hover { color: var(--lp-tinta); background: rgba(0, 0, 0, 0.05); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-dow {
      font-family: var(--font-sans); font-size: 0.56rem; font-weight: 600; text-align: center;
      color: var(--lp-suave); padding: 0.2rem 0; text-transform: uppercase;
    }
    .cal-dia {
      font-family: var(--font-sans); font-size: 0.66rem; text-align: center; padding: 0.28rem 0;
      border-radius: 4px; cursor: pointer; color: var(--lp-suave); text-decoration: none;
      transition: background 0.1s, color 0.1s;
    }
    .cal-dia:hover { background: rgba(26, 60, 46, 0.08); color: var(--lp-tinta); }
    .cal-dia.hoje { background: var(--color-primary); color: #fff; font-weight: 600; }
    .cal-dia.selecionado { background: rgba(26, 60, 46, 0.15); color: var(--color-primary); font-weight: 600; }
    .cal-dia.vazio { cursor: default; }
    .cal-dia.fora-range { opacity: 0.3; pointer-events: none; }

    /* ── Faixas florais ──────────────────────────────────────────────────── */
    /* Fixas: ocupam a altura da tela e ficam paradas enquanto a leitura rola */
    .lp-faixa {
      grid-row: 1;
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      background: #1b1a18 url('/assets/img/liturgia-faixa.webp') repeat-y center top / 100% auto;
    }
    .lp-faixa-esq { grid-column: 2; }
    .lp-faixa-dir { grid-column: 4; }

    /* ── Coluna de leitura ───────────────────────────────────────────────── */
    .lp-main {
      grid-column: 3;
      grid-row: 1;
      min-width: 0;
      padding: 3.25rem 2.5rem 7rem;
    }

    .leitura-card { position: relative; scroll-margin-top: 1.5rem; }

    /* Ornamento com a cruz entre as seções */
    .leitura-card + .leitura-card::before,
    .missa-extra::before {
      content: '';
      display: block;
      width: min(386px, 100%);
      height: 77px;
      margin: 4.5rem auto;
      background: url('/assets/img/liturgia-divisor.svg') center / contain no-repeat;
    }
    /* A aclamação anuncia o evangelho: os dois ficam juntos, sem ornamento entre eles */
    .leitura-card.secao-menor + .leitura-card::before { display: none; }
    .leitura-card.secao-menor + .leitura-card { margin-top: 2.5rem; }

    .leitura-label {
      font-family: var(--font-titulo);
      font-style: italic;
      font-weight: 400;
      font-size: 65px;
      line-height: 1.5;
      letter-spacing: -0.03em;
      color: var(--lp-tinta);
      text-transform: none;
    }
    .secao-menor .leitura-label { font-size: 40px; line-height: 1.3; margin-bottom: 0.35rem; }

    .leitura-ref {
      font-size: 16px;
      line-height: 1.5;
      color: var(--lp-tinta);
      margin-bottom: 11px;
    }

    .leitura-titulo {
      font-style: italic;
      font-size: 16px;
      line-height: 1.5;
      color: var(--lp-tinta);
      margin: 0 0 11px;
    }

    .leitura-texto {
      font-size: 16px;
      line-height: 1.6;
      color: var(--lp-texto);
    }
    .leitura-texto p { margin: 0; }

    .vers-num {
      font-size: 0.66em;
      color: var(--lp-vermelho);
      vertical-align: super;
      margin-right: 0.15em;
      user-select: none;
    }

    /* Salmo: refrão e estrofes em parágrafos, com uma linha de respiro */
    .salmo-refrao, .acl-verso { margin-bottom: 24px; }
    .salmo-r-label { margin-right: 0.3rem; color: var(--lp-tinta); }
    .salmo-estrofe { margin-bottom: 24px; }
    .salmo-r-sep { display: none; }
    .salmo-r-sep.com-texto { display: block; margin-bottom: 24px; font-style: italic; }
    .leitura-texto > :last-child { margin-bottom: 0; }

    .salmo-ou, .leitura-alt-ou {
      font-family: var(--font-sans);
      font-size: 0.64rem;
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lp-suave);
      margin: 0 0.35rem;
    }

    /* Leitura "à escolha": recolhida sob a principal */
    .leitura-alt { margin-top: 1.75rem; padding-top: 0.9rem; border-top: 1px dotted rgba(0, 0, 0, 0.28); }
    .leitura-alt > summary { cursor: pointer; font-size: 0.9rem; color: var(--lp-suave); }
    .leitura-alt > summary .leitura-alt-ou { margin-left: 0; }
    .leitura-alt[open] > summary { margin-bottom: 1rem; }

    /* Outras missas do dia (vigília, noite, aurora, leituras à escolha) */
    .missa-extra > summary {
      cursor: pointer;
      font-family: var(--font-titulo);
      font-style: italic;
      font-size: 40px;
      line-height: 1.3;
      letter-spacing: -0.03em;
      color: var(--lp-tinta);
      list-style-position: outside;
    }
    .missa-extra[open] > summary { margin-bottom: 2.5rem; }

    .loading, .erro {
      font-style: italic;
      color: var(--lp-suave);
      text-align: center;
      padding: 4rem 0;
      font-size: 1rem;
    }

    /* ── Entrada do texto, linha a linha (liturgiadiaria.js › animarEntrada) ── */
    .lp-palavra { display: inline-block; }
    .lp-oculto { opacity: 0; }
    .lp-entra {
      animation: lp-entrada 0.85s cubic-bezier(0.2, 0.65, 0.25, 1) both;
      animation-delay: var(--lp-atraso, 0ms);
    }
    @keyframes lp-entrada {
      from { opacity: 0; transform: translateY(0.6em); filter: blur(3px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lp-oculto { opacity: 1; }
      .lp-entra { animation: none; }
    }

    /* ── Abas (celular) ──────────────────────────────────────────────────── */
    .lp-tabs {
      display: none;
      overflow-x: auto;
      gap: 0.25rem;
      padding: 0.75rem 1.25rem 0;
      scrollbar-width: none;
      border-bottom: 1px solid var(--lp-linha);
      background: var(--lp-fundo);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .lp-tabs::-webkit-scrollbar { display: none; }
    .lp-tabs a {
      display: inline-block;
      white-space: nowrap;
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
      color: var(--lp-suave);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.12s, border-color 0.12s;
    }
    .lp-tabs a.ativa { color: var(--lp-tinta); border-bottom-color: var(--lp-tinta); }

    /* ── Responsivo ──────────────────────────────────────────────────────── */
    /* Até 1320px: some a faixa da direita; o calendário vem logo depois do texto */
    @media (max-width: 1320px) {
      .lp-pagina { grid-template-columns: 250px 88px minmax(0, 560px) 300px minmax(0, 1fr); }
      .lp-faixa-dir { display: none; }
      .lp-direita { grid-column: 4; padding: 3.25rem 1.5rem 3rem 1rem; }
      .lp-main { padding: 3.25rem clamp(1.75rem, 3.5vw, 2.75rem) 7rem; }
      .lp-titulo { font-size: 62px; }
    }

    /* Até 1080px: sem espaço para três colunas de conteúdo; o calendário volta para baixo do título */
    @media (max-width: 1080px) {
      .lp-pagina { grid-template-columns: 290px 72px minmax(0, 1fr); grid-template-rows: auto 1fr; }
      .lp-lateral { position: static; max-height: none; overflow: visible; }
      .lp-direita { grid-column: 1; grid-row: 2; position: static; padding: 0 2rem 3rem 1.95rem; }
      .lp-faixa-esq, .lp-main { grid-row: 1 / span 2; }
      .cal-wrap { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--lp-linha); }
    }

    @media (max-width: 760px) {
      .lp-pagina { display: flex; flex-direction: column; }
      .lp-lateral { order: 1; }
      .lp-direita { order: 2; padding: 0 3.125rem 0.5rem; }
      .lp-lateral, .lp-direita { align-self: stretch; }
      .lp-tabs { order: 3; }
      .lp-main { order: 4; }
      /* Faixas nas bordas da tela, metade para fora: enfeitam sem espremer o texto */
      .lp-faixa { display: block; position: fixed; top: 0; height: 100vh; width: 56px; z-index: 20; }
      .lp-faixa-esq { left: -30px; }
      .lp-faixa-dir { right: -30px; }
      .lp-lateral { position: static; max-height: none; overflow: visible; padding: 1.75rem 3.125rem 0.5rem; }
      .lp-titulo { font-size: 52px; margin-bottom: 1rem; }
      .lp-tabs { display: flex; padding: 0.75rem 2.875rem 0; }
      .lp-main { padding: 2rem 3.125rem 6rem; max-width: none; }
      .leitura-label { font-size: 48px; line-height: 1.3; }
      .secao-menor .leitura-label, .missa-extra > summary { font-size: 32px; }
      .leitura-card + .leitura-card::before, .missa-extra::before { margin: 3rem auto; height: 60px; }
    }
  </style>
</head>
<body>

<div class="lp-pagina">

  <!-- ── Lateral: título e dia litúrgico ─────────────────────────────────── -->
  <aside class="lp-lateral">
    <h1 class="lp-titulo">Liturgia<br>Diária</h1>
    <p class="lp-data" id="lp-data">Carregando…</p>
    <div class="tempo-wrap" id="lp-tempo-wrap" style="display:none">
      <span class="cor-dot" id="lp-cor-dot"></span>
      <span class="tempo-badge" id="lp-tempo"></span>
    </div>
    <p class="nome-dia" id="lp-nome-dia" style="display:none"></p>

    <ul class="lp-nav" id="lp-nav" aria-label="Leituras do dia"></ul>
  </aside>

  <div class="lp-faixa lp-faixa-esq" aria-hidden="true"></div>

  <!-- ── Abas (celular) ──────────────────────────────────────────────────── -->
  <nav class="lp-tabs" id="lp-tabs" aria-label="Leituras"></nav>

  <!-- ── Leituras ────────────────────────────────────────────────────────── -->
  <main class="lp-main" id="conteudo">
    <p class="loading">Buscando leituras do dia…</p>
  </main>

  <div class="lp-faixa lp-faixa-dir" aria-hidden="true"></div>

  <!-- ── Direita: calendário ─────────────────────────────────────────────── -->
  <aside class="lp-direita" aria-label="Calendário da liturgia">
    <div class="cal-wrap" id="cal-wrap"></div>
  </aside>

</div>

<script type="module" src="/liturgiadiaria/liturgiadiaria.js"></script>
</body>
</html>
